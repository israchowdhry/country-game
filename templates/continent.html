<!DOCTYPE html>
<html>

<head>

    <title>{{ continent_name }}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<header>

    <h1>🌍 {{ continent_name }}</h1>

</header>


<div class="container">

    <div class="game-area">

        <h2>Name a Country</h2>

        <form method="POST">

            <input
                type="text"
                name="country"
                placeholder="Type a country..."
                autocomplete="off"
                autofocus
            >

        </form>


        <p class="message">
            {{ message }}
        </p>


        <p class="score">

            Countries found:

            <strong>
                {{ guessed_countries|length }}
                /
                {{ total_countries }}
            </strong>

        </p>


        <h2>Countries Found</h2>

        <ul class="country-list">

            {% for country in guessed_countries %}

                <li>
                    ✓ {{ country }}
                </li>

            {% endfor %}

        </ul>


        <a class="back-link" href="/">
            ← Choose another continent
        </a>

        <a href="/reset">Reset Progress</a>

    </div>

</div>

</body>

</html>
